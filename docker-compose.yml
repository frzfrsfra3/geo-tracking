version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P@ssw0rd
    ports:
      - "5433:5432"   # Host port 5433 → container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./geo-backend
      dockerfile: Dockerfile
    container_name: geo_backend
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_KEY: base64:eINHuFz+ixvP8HgFCoS4oLxI44teGcQc0wQp6oCK+c4=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: task
      DB_USERNAME: postgres
      DB_PASSWORD: P@ssw0rd
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: 953344
      REVERB_APP_KEY: aubsfb2oasbmgcwk5bse
      REVERB_APP_SECRET: vtccszuswnuxgbwyflqk
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "8001:8000"   # Host port 8001 → container 8000
    depends_on:
      db:
        condition: service_healthy
      reverb:
        condition: service_started
    command: sh -c "php artisan migrate --force && php -S 0.0.0.0:8000 -t public"

  reverb:
    build:
      context: ./geo-backend
      dockerfile: Dockerfile
    container_name: geo_reverb
    restart: unless-stopped
    environment:
      REVERB_APP_ID: 953344
      REVERB_APP_KEY: aubsfb2oasbmgcwk5bse
      REVERB_APP_SECRET: vtccszuswnuxgbwyflqk
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "8081:8080"   # Host port 8081 → container 8080
    command: php artisan reverb:start --debug

  frontend:
    build:
      context: ./geo-frontend
      dockerfile: Dockerfile
    container_name: geo_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
      NEXT_PUBLIC_REVERB_APP_KEY: aubsfb2oasbmgcwk5bse
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: 8081
      NEXT_PUBLIC_REVERB_SCHEME: http
      NEXT_PUBLIC_MAPBOX_TOKEN: yourmapboxsecret
    ports:
      - "3001:3000"   # Host port 3001 → container 3000
    depends_on:
      - backend
  faker:
    image: node:22-alpine
    container_name: geo_faker
    working_dir: /app
    volumes:
      - ./fake.js:/app/faker.js   
    command: node faker.js
    depends_on:
      backend:
        condition: service_started
      reverb:
        condition: service_started
    restart: "no"

volumes:
  pgdata: